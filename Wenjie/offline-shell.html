<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>问界</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#168bd8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center}.shell{width:100%;max-width:520px;height:100%;padding:calc(env(safe-area-inset-top) + 28px) 18px 0;color:#fff;background:linear-gradient(180deg,#168bd8 0%,#168bd8 68%,#258ee2 100%)}.title{height:64px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;letter-spacing:2px}.back{position:absolute;top:calc(env(safe-area-inset-top) + 34px);left:24px;width:38px;height:38px;border:1px solid rgba(255,255,255,.7);border-radius:50%;font-size:30px;line-height:32px;text-align:center;color:#ffe27a}.notice{height:50px;border-radius:28px;background:rgba(0,72,170,.48);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;gap:10px;padding:0 16px;overflow:hidden;white-space:nowrap;font-size:16px}.notice img{width:28px;height:28px;object-fit:contain}.hero{height:178px;margin-top:12px;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.28);background:rgba(30,145,230,.45)}.hero img{width:100%;height:100%;object-fit:cover}.tabs{display:flex;gap:16px;margin:12px 2px}.tabs button{height:54px;min-width:140px;border:0;border-radius:30px;background:linear-gradient(#fff,#bfe6ff);color:#fff;font-size:21px;font-weight:700;text-shadow:0 1px 2px #5da4d9}.games{display:grid;gap:10px}.card{height:128px;border-radius:20px;background:linear-gradient(135deg,#28b8ed,#2581e3);border:1px solid rgba(255,255,255,.45);padding:16px;display:flex;align-items:center;gap:16px}.card img{width:74px;height:74px;object-fit:contain}.card b{font-size:24px}.card span{margin-left:auto;font-size:18px;background:#fff;color:#222;padding:8px 12px;border-radius:12px}.foot{position:fixed;left:0;right:0;bottom:0;height:92px;background:linear-gradient(180deg,rgba(31,127,220,.08),rgba(15,75,167,.48));display:flex;justify-content:space-around;align-items:flex-end;padding-bottom:12px;font-size:14px}.foot div{text-align:center;font-weight:600}.foot img{display:block;width:42px;height:42px;object-fit:contain;margin:auto}
  </style>
</head>
<body>
  <main class="shell">
    <div class="back">‹</div><div class="title">游戏大厅</div>
    <div class="notice"><img src="fn_static/Style/newimg/laba.png">彩乐园官方直营平台 安全稳定、极速出款</div>
    <div class="hero"><img src="fn_static/Style/newimg/home_banner_default.jpg"></div>
    <div class="tabs"><button>弹珠</button><button>彩票</button></div>
    <div class="games"><div class="card"><img src="fn_static/Style/newimg/game_8.png"><b>极速弹珠</b><span>进入</span></div><div class="card"><img src="fn_static/Style/newimg/game_9.png"><b>弹珠PK10</b><span>进入</span></div></div>
  </main>
  <nav class="foot"><div><img src="fn_static/Style/newimg/m_icon_1.png">在线客服</div><div><img src="fn_static/Style/newimg/m_icon_2.png">VIP等级</div><div><img src="fn_static/Style/newimg/m_icon_3.png">优惠活动</div><div><img src="fn_static/Style/newimg/m_icon_4.png">房间介绍</div><div><img src="fn_static/Style/newimg/ic_member_register.webp">个人中心</div></nav>
</body>
</html>
