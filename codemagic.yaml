workflows:
  ios-release:
    name: Wenjie iOS Build
    max_build_duration: 60
    environment:
      groups:
        - apple_credentials
    scripts:
      - name: Build and archive
        script: |
          xcodebuild -project Wenjie.xcodeproj \
            -scheme Wenjie \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Wenjie.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
    artifacts:
      - build/*.xcarchive
